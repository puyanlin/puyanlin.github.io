<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>奇貼 KidStickers & 一起貼 TogetherStickers 支援 Support</title>
  <!-- 已搬到 www.kidstickers.app/support（App Store 的「App 支援」網址改過去之前，舊連結先轉址） -->
  <link rel="canonical" href="https://www.kidstickers.app/support" />
  <meta http-equiv="refresh" content="0; url=https://www.kidstickers.app/support" />
  <script>
    (function () {
      // 舊頁面有語言切換（存在 localStorage 的 kidstickers_lang）；英文使用者直接到英文版
      var lang = "";
      try { lang = localStorage.getItem("kidstickers_lang") || ""; } catch (e) {}
      if (!lang) lang = navigator.language || "";
      location.replace("https://www.kidstickers.app/support" + (/^zh/i.test(lang) ? "" : "#en"));
    })();
  </script>
</head>
<body>
  <p>支援頁已搬到 <a href="https://www.kidstickers.app/support">www.kidstickers.app/support</a>。</p>
  <p lang="en">Support has moved to <a href="https://www.kidstickers.app/support#en">www.kidstickers.app/support</a>.</p>
</body>
</html>
